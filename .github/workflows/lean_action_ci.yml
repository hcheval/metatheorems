name: Lean Action CI

on:
  # `push:` and `pull_request:` disabled 2026-09-06, before the first push to a private
  # backup remote: they would have started a full Mathlib build on every branch of a
  # five-branch backup push. Re-enable by uncommenting when the repo faces outward.
  # push:
  # pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - uses: leanprover-community/docgen-action@v1
