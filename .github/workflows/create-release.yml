name: Create Release

on:
  # Disabled 2026-09-06, before the first push to a private backup remote: this would have
  # cut a GitHub release automatically on that push. Re-enable when the repo faces outward.
  # push:
  #   branches:
  #     - 'main'
  workflow_dispatch:
      - 'master'
    paths:
      - 'lean-toolchain'

jobs:
  lean-release-tag:
    name: Add Lean release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: lean-release-tag action
      uses: leanprover-community/lean-release-tag@v1
      with:
        do-release: true
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
