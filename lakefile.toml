name = "metatheorems"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Metatheorems"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.28.0"

[[lean_lib]]
name = "Metatheorems"

# Sweep target for Metatheorems/Probes/, which the umbrella deliberately does not import.
# Not in defaultTargets: `lake build` stays fast. Run `lake build Probes` after any change
# to Term's/Derivable's indices. See Probes.lean for why this exists.
[[lean_lib]]
name = "Probes"

# The presenter's live-demo file, `Demo/Walkthrough.lean`. Deliberately NOT in
# `defaultTargets`: a plain `lake build` stays fast. `lake build Demo` builds it, and
# `Metatheorems/Probes/DemoChecks.lean` (in the `Probes` sweep) imports it, so the sweep
# keeps it green and checks its extraction commands.
[[lean_lib]]
name = "Demo"
roots = ["Demo.Walkthrough"]
